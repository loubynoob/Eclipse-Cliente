name: Build Crescent Eclipse Client
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Unzip any project zip in the repo
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -o -q "$z" -d work
          done

      - name: Find the Gradle project folder
        id: find
        shell: bash
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | sort | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle found anywhere in the repo."; ls -R | head -50; exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Build Fabric mod
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crescent-Eclipse-Client
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
